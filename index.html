<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e5e5e5;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overflow-x:hidden}
.container{max-width:800px;margin:0 auto;padding:20px 16px 40px}
 
/* Stat Cards */
.stats-row{display:flex;gap:8px;margin-bottom:20px;width:100%}
.stat-card{background:linear-gradient(135deg,#1e1e2e,#2a2a3e);border-radius:12px;padding:10px;flex:1 1 0%;min-width:0;overflow:hidden}
.stat-label{color:#6b7280;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;white-space:nowrap}
.stat-value{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{color:#555;font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 
/* Table */
.section-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.table-wrap{background:#1a1a2a;border-radius:14px;border:1px solid #252535;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px;text-align:left;font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;border-bottom:2px solid #333}
td{padding:10px;white-space:nowrap}
tr.data-row{border-bottom:1px solid #252535;transition:background .15s}
tr.data-row:last-child{border-bottom:none}
tr.data-row:hover{background:#222235}
.empty-state{text-align:center;padding:48px 20px;color:#555}
 
/* Prize Rules */
.rules-panel{background:#1a1a2a;border-radius:12px;border:1px solid #333;margin-top:24px;overflow:hidden}
.rules-toggle{width:100%;padding:14px 20px;background:none;border:none;color:#ccc;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.rules-body{padding:0 16px 16px;font-size:13px;color:#9ca3af;line-height:1.6}
.streak-box{margin-bottom:16px;padding:10px 14px;background:#0f0f1a;border-radius:8px;border:1px solid #252535}
.streak-box-title{color:#FC4C02;font-weight:600;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.prize-table{width:100%;font-size:12px;border-collapse:collapse;border:1px solid #333}
.prize-table th{padding:8px 12px;font-weight:700;border-bottom:1px solid #333;border-right:1px solid #333;background:#0f0f1a}
.prize-table th:last-child{border-right:none}
.prize-table td{padding:8px 12px;border-bottom:1px solid #252535;border-right:1px solid #252535}
.prize-table td:last-child{border-right:none}
.prize-table tr:last-child td{border-bottom:none}
 
.footer{text-align:center;margin-top:24px;padding:16px 0;color:#333;font-size:12px}
 
/* Trends */
.trends-panel{background:#1a1a2a;border-radius:12px;border:1px solid #333;margin-top:24px;overflow:hidden}
.trends-toggle{width:100%;padding:14px 20px;background:none;border:none;color:#ccc;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.trends-body{padding:0 16px 16px}
.trends-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.trends-card{background:#0f0f1a;border-radius:8px;border:1px solid #252535;padding:14px}
.trends-card-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.trends-legend{display:flex;gap:12px;margin-bottom:6px;font-size:10px;color:#9ca3af}
.trends-time-wrap{display:flex;justify-content:center}
.trends-time-card{width:100%;max-width:380px}
@media(max-width:600px){
  .trends-grid{grid-template-columns:1fr}
  .trends-time-card{max-width:100%}
}
</style>
</head>

// ============================================================
// STREAK & PRIZE CALCULATION
// ============================================================
function calculateStreaks(runs) {
  if (!runs.length) return [];
  const sorted = [...runs].sort((a, b) =>
    new Date(a.date + "T" + (a.time || "00:00")) - new Date(b.date + "T" + (b.time || "00:00"))
  );
  const result = [];
  let streak = 1;
  for (let i = 0; i < sorted.length; i++) {
    if (i === 0) { streak = 1; }
    else {
      const gap = Math.round((new Date(sorted[i].date) - new Date(sorted[i-1].date)) / 864e5);
      if (gap <= 1) streak += 1;
      else if (gap === 2) streak = Math.max(streak - 1, 1);
      else streak = 1;
    }
    result.push({ ...sorted[i], streak });
  }
  return result;
}
 
function calculatePrize(dist, streak, pace) {
  // If pace > 8 min/km, it's a walk — count half distance
  const paceMin = pace ? parseFloat(pace.split(":")[0]) + parseFloat(pace.split(":")[1] || 0) / 60 : 0;
  const effectiveDist = paceMin > 8 ? dist / 2 : dist;
  if (effectiveDist < 3.5) return 0;
  let base = streak > 10 ? 700 : streak > 5 ? 500 : streak > 2 ? 350 : 0;
  if (!base) return 0;
  if (effectiveDist > 10) return base * 3;
  if (effectiveDist > 5) return base * 2;
  return base;
}
 
function streakColor(s) { return s > 10 ? "#f59e0b" : s > 5 ? "#f97316" : s > 2 ? "#ef4444" : "#6b7280"; }
function streakEmoji(s) { return s > 10 ? "\u{1F525}\u{1F525}\u{1F525}" : s > 5 ? "\u{1F525}\u{1F525}" : s > 2 ? "\u{1F525}" : ""; }
function fmtDate(d) { const dt = new Date(d + "T00:00:00"); return dt.getDate() + " " + dt.toLocaleDateString("en-IN", { month: "short" }); }

          </thead>
          <tbody>
            <tr><td style="font-weight:600;color:#ccc">&lt; 3.5 km</td><td style="text-align:center;color:#444">\u20B90</td><td style="text-align:center;color:#444">\u20B90</td><td style="text-align:center;color:#444">\u20B90</td></tr>
            <tr><td style="font-weight:600;color:#ccc">3.5 \u2013 5 km</td><td style="text-align:center;color:#e5e5e5">\u20B9350</td><td style="text-align:center;color:#e5e5e5">\u20B9500</td><td style="text-align:center;color:#e5e5e5">\u20B9700</td></tr>
            <tr><td style="font-weight:600;color:#ccc">5 \u2013 10 km</td><td style="text-align:center;color:#e5e5e5">\u20B9700</td><td style="text-align:center;color:#e5e5e5">\u20B91,000</td><td style="text-align:center;color:#e5e5e5">\u20B91,400</td></tr>
            <tr><td style="font-weight:600;color:#ccc">&gt; 10 km</td><td style="text-align:center;color:#e5e5e5">\u20B91,050</td><td style="text-align:center;color:#e5e5e5">\u20B91,500</td><td style="text-align:center;color:#e5e5e5">\u20B92,100</td></tr>
          </tbody>
        </table>
      </div>
    </div>
 
    <div class="footer">Running Leaderboard \u2022 Dhananjay S</div>
  `;
 
  // Rules toggle
  document.getElementById("rulesToggle").addEventListener("click", () => {
    const body = document.getElementById("rulesBody");
    const chevron = document.getElementById("rulesChevron");
    const visible = body.style.display !== "none";
    body.style.display = visible ? "none" : "block";
    chevron.innerHTML = visible
      ? '<polyline points="6 9 12 15 18 9"/>'
      : '<polyline points="18 15 12 9 6 15"/>';
  });
 
  // Trends toggle — init charts on first open
  let trendsInit = false;
  document.getElementById("trendsToggle").addEventListener("click", () => {
    const body = document.getElementById("trendsBody");
    const chevron = document.getElementById("trendsChevron");
    const visible = body.style.display !== "none";
    body.style.display = visible ? "none" : "block";
    chevron.innerHTML = visible
      ? '<polyline points="6 9 12 15 18 9"/>'
      : '<polyline points="18 15 12 9 6 15"/>';
    if (!visible && !trendsInit) { trendsInit = true; initTrendCharts(); }
  });
}
 
render();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
function initTrendCharts() {
  const paceToMin = p => { const [m, s] = p.split(":").map(Number); return Math.round((m + s / 60) * 100) / 100; };
  const isWalk = r => paceToMin(r.pace) > 8;
  const effectiveDist = r => isWalk(r) ? Math.round(r.distance / 2 * 100) / 100 : r.distance;
  const timeToDecimal = t => { const [h, m] = t.split(":").map(Number); return Math.round((h + m / 60) * 100) / 100; };
 
  const labels = RUNS.map(r => {
    const d = new Date(r.date + "T00:00:00");
    return d.getDate() + " " + d.toLocaleDateString("en-IN", { month: "short" });
  });
 
  Chart.defaults.color = "#6b7280";
  Chart.defaults.borderColor = "#252535";
  Chart.defaults.font.family = "Inter, -apple-system, sans-serif";
 
  function linReg(points) {
    const n = points.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    points.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; });
    const denom = n * sxx - sx * sx;
    if (Math.abs(denom) < 1e-10) return null;
    const slope = (n * sxy - sx * sy) / denom;
    const intercept = (sy - slope * sx) / n;
    return { slope, intercept };
  }
 
  const EPOCH = new Date("2026-04-07T00:00:00");
  function getFortnightIdx(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return Math.floor((d - EPOCH) / (86400000 * 14));
  }
 
  function fortnightTrendDatasets(runs, valueFn, filterFn, color, dash) {
    const fns = {};
    runs.forEach((r, i) => {
      if (!filterFn(r)) return;
      const f = getFortnightIdx(r.date);
      if (!fns[f]) fns[f] = [];
      fns[f].push({ idx: i, val: valueFn(r) });
    });
    const ds = [];
    Object.values(fns).forEach(pts => {
      if (pts.length < 2) return;
      const reg = linReg(pts.map(p => [p.idx, p.val]));
      if (!reg) return;
      const data = new Array(runs.length).fill(null);
      data[pts[0].idx] = Math.round((reg.slope * pts[0].idx + reg.intercept) * 100) / 100;
      data[pts[pts.length - 1].idx] = Math.round((reg.slope * pts[pts.length - 1].idx + reg.intercept) * 100) / 100;
      ds.push({ data, borderColor: color, borderWidth: 2.5, borderDash: dash, pointRadius: 0, tension: 0, fill: false, spanGaps: true });
    });
    return ds;
  }
 
  function overallTrendDataset(runs, valueFn, filterFn, color, dash) {
    const pts = [];
    runs.forEach((r, i) => { if (filterFn(r)) pts.push([i, valueFn(r)]); });
    const reg = linReg(pts);
    if (!reg) return null;
    return { data: runs.map((_, i) => Math.round((reg.slope * i + reg.intercept) * 100) / 100), borderColor: color, borderWidth: 2, borderDash: dash || [], pointRadius: 0, tension: 0, fill: false };
  }
 
  const fmtPace = v => { if (v == null) return ""; const m = Math.floor(v); const s = Math.round((v - m) * 60); return m + ":" + String(s).padStart(2, "0") + "/km"; };
  const fmtTime = v => { if (v == null) return ""; const h = Math.floor(v); const m = Math.round((v - h) * 60); const h12 = h > 12 ? h - 12 : h; return h12 + ":" + String(m).padStart(2, "0") + " PM"; };
 
  // ---- Distance chart ----
  const runDistData = RUNS.map(r => isWalk(r) ? null : effectiveDist(r));
  const walkDistData = RUNS.map(r => isWalk(r) ? effectiveDist(r) : null);
  new Chart(document.getElementById("distChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { data: runDistData, borderColor: "transparent", pointRadius: 4, pointBackgroundColor: "rgba(59,130,246,0.3)", pointBorderColor: "rgba(59,130,246,0.3)", showLine: false },
        { data: walkDistData, borderColor: "transparent", pointRadius: 5, pointStyle: "triangle", pointBackgroundColor: "rgba(245,158,11,0.3)", pointBorderColor: "rgba(245,158,11,0.3)", showLine: false },
        overallTrendDataset(RUNS, effectiveDist, isWalk, "#f59e0b", [6, 3]),
        ...fortnightTrendDatasets(RUNS, effectiveDist, r => !isWalk(r), "#3b82f6", []),
      ].filter(Boolean)
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { filter: item => item.datasetIndex <= 1, callbacks: { label: ctx => { const r = RUNS[ctx.dataIndex]; return isWalk(r) ? effectiveDist(r).toFixed(2) + " km (walk, actual " + r.distance.toFixed(2) + ")" : r.distance.toFixed(2) + " km"; } } } },
      scales: { x: { ticks: { maxRotation: 45, font: { size: 9 }, maxTicksLimit: 10 }, grid: { display: false } }, y: { beginAtZero: true, ticks: { font: { size: 10 }, callback: v => v + " km" }, grid: { color: "#1e1e2e" } } }
    }
  });
 
  // ---- Pace chart ----
  const runPaceData = RUNS.map(r => isWalk(r) ? null : paceToMin(r.pace));
  const walkPaceData = RUNS.map(r => isWalk(r) ? paceToMin(r.pace) : null);
  new Chart(document.getElementById("paceChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { data: runPaceData, borderColor: "transparent", pointRadius: 4, pointBackgroundColor: "rgba(59,130,246,0.3)", pointBorderColor: "rgba(59,130,246,0.3)", showLine: false },
        { data: walkPaceData, borderColor: "transparent", pointRadius: 5, pointStyle: "triangle", pointBackgroundColor: "rgba(245,158,11,0.3)", pointBorderColor: "rgba(245,158,11,0.3)", showLine: false },
        overallTrendDataset(RUNS, r => paceToMin(r.pace), isWalk, "#f59e0b", [6, 3]),
        ...fortnightTrendDatasets(RUNS, r => paceToMin(r.pace), r => !isWalk(r), "#3b82f6", []),
      ].filter(Boolean)
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { filter: item => item.datasetIndex <= 1, callbacks: { label: ctx => fmtPace(ctx.parsed.y) } } },
      scales: { x: { ticks: { maxRotation: 45, font: { size: 9 }, maxTicksLimit: 10 }, grid: { display: false } }, y: { reverse: true, min: 5, max: 15, ticks: { font: { size: 10 }, callback: v => fmtPace(v) }, grid: { color: "#1e1e2e" } } }
    }
  });
 
  // ---- Time chart ----
  const timeData = RUNS.map(r => timeToDecimal(r.time));
  new Chart(document.getElementById("timeChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { data: timeData, borderColor: "transparent", pointRadius: 4, pointBackgroundColor: "rgba(252,76,2,0.35)", pointBorderColor: "rgba(252,76,2,0.35)", showLine: false },
        ...fortnightTrendDatasets(RUNS, r => timeToDecimal(r.time), () => true, "#FC4C02", []),
      ].filter(Boolean)
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { filter: item => item.datasetIndex === 0, callbacks: { label: ctx => fmtTime(ctx.parsed.y) } } },
      scales: { x: { ticks: { maxRotation: 45, font: { size: 9 }, maxTicksLimit: 10 }, grid: { display: false } }, y: { reverse: false, min: 18, max: 22.5, ticks: { font: { size: 10 }, stepSize: 0.5, callback: v => fmtTime(v) }, grid: { color: "#1e1e2e" } } }
    }
  });
}
</script>
